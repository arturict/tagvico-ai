server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coolify's path-domain middleware strips /docs before proxying here.
    # Unknown paths must answer 404: falling back to /index.html served the
    # overview with status 200, which Google reports as a soft 404.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location ~* \.txt$ {
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
