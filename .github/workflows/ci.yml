name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Keep the required `quality` check present on every PR. Workflow-level
      # path filters can leave required checks pending, so only known
      # non-product repository metadata takes this lightweight path.
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run_full=true
          if [[ -n "$BASE_SHA" ]] &&
             [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            fi
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              run_full=false
              changed=false
              while IFS= read -r -d '' path; do
                changed=true
                case "$path" in
                  .github/FUNDING.yml|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|CODE_OF_CONDUCT.md|docs/launch-post.md)
                    ;;
                  *)
                    run_full=true
                    ;;
                esac
              # Disable rename detection so a product file renamed into an
              # allowlisted metadata path is still reported as a deletion and
              # an addition. Either side then forces the full gate.
              done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA")
              [[ "$changed" == "true" ]] || run_full=true
            fi
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

      # Reads the pnpm version from package.json "packageManager"; it must run
      # before setup-node so the pnpm store cache can be resolved.
      - name: Set up pnpm
        if: steps.changes.outputs.run_full == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node
        if: steps.changes.outputs.run_full == 'true' && github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PR caches are branch-scoped. A single Tagvico npm cache was about
      # 697 MB, so only the default branch writes the pnpm store cache.
      - name: Set up Node with default-branch pnpm cache
        if: steps.changes.outputs.run_full == 'true' && github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install locked dependencies
        if: steps.changes.outputs.run_full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run quality checks and unit tests
        if: steps.changes.outputs.run_full == 'true'
        run: pnpm test

      - name: Build versioned documentation
        if: steps.changes.outputs.run_full == 'true'
        run: pnpm docs:build

      - name: Audit production dependencies
        if: steps.changes.outputs.run_full == 'true'
        run: pnpm audit --prod --audit-level high

      - name: Check compiled server syntax
        if: steps.changes.outputs.run_full == 'true'
        run: node --check dist/server.js
        # Syntax-only smoke test; starting the server would keep CI alive.

      - name: Verify package scripts
        if: steps.changes.outputs.run_full == 'true'
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts.start) throw new Error('missing start script')"

      - name: Record metadata-only validation
        if: steps.changes.outputs.run_full != 'true'
        run: echo "Only non-product repository metadata changed; the required quality check remains satisfied."
