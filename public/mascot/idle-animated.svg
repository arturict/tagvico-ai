<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges" class="mascot is-idle" role="img" aria-label="Tagvico mascot"><style>.mascot{display:inline-block;flex:none;overflow:visible;vertical-align:middle;}.mascot g{transform-box:fill-box;}.mascot.is-idle .mascot-eyes,.mascot.is-waving .mascot-eyes{transform-origin:50% 100%;animation:mascot-blink 5.6s steps(1,end) infinite;}@keyframes mascot-blink{0%,92%{transform:scaleY(1);}93%,96%{transform:scaleY(0.5);}97%,100%{transform:scaleY(1);}}.mascot.is-thinking .mascot-body{animation:mascot-bob 1.2s steps(1,end) infinite;}@keyframes mascot-bob{50%{transform:translateY(-1px);}}.mascot.is-thinking .mascot-dot{animation:mascot-dot 1.8s steps(1,end) infinite both;}.mascot.is-thinking .mascot-dot.is-2{animation-delay:0.35s;}.mascot.is-thinking .mascot-dot.is-3{animation-delay:0.7s;}@keyframes mascot-dot{0%{opacity:0;}20%,80%{opacity:1;}100%{opacity:0;}}.mascot.is-happy .mascot-body{animation:mascot-hop 2.6s steps(1,end) infinite;}@keyframes mascot-hop{0%{transform:translateY(0);}10%{transform:translateY(-2px);}18%{transform:translateY(-1px);}26%,100%{transform:translateY(0);}}.mascot.is-happy .mascot-spark{animation:mascot-twinkle 1.4s steps(1,end) infinite;}@keyframes mascot-twinkle{50%{opacity:0.25;}}.mascot.is-sleeping .mascot-body{animation:mascot-breathe 3.2s steps(1,end) infinite;}@keyframes mascot-breathe{50%{transform:translateY(1px);}}.mascot.is-sleeping .mascot-z{animation:mascot-drift 3.2s steps(1,end) infinite both;}.mascot.is-sleeping .mascot-z.is-1{animation-delay:1.6s;}@keyframes mascot-drift{0%{opacity:0;transform:translateY(1px);}15%{opacity:1;}50%{transform:translateY(0);}85%{opacity:0.4;transform:translateY(-1px);}100%{opacity:0;}}.mascot.is-searching .mascot-lens{animation:mascot-sweep 3s steps(1,end) infinite;}.mascot.is-searching .mascot-eyes{animation:mascot-look 3s steps(1,end) infinite;}@keyframes mascot-sweep{40%{transform:translateX(-1px);}80%{transform:translateX(0);}}@keyframes mascot-look{40%{transform:translateX(-1px);}80%{transform:translateX(0);}}.mascot.is-oops .mascot-body{animation:mascot-shake 0.6s steps(1,end) 0.15s 2;}@keyframes mascot-shake{0%{transform:translateX(0);}25%{transform:translateX(-1px);}50%{transform:translateX(1px);}75%{transform:translateX(-1px);}100%{transform:translateX(0);}}.mascot.is-oops .mascot-drop{animation:mascot-drip 1.8s steps(1,end) infinite;}@keyframes mascot-drip{50%{transform:translateY(1px);}80%{transform:translateY(2px);opacity:0.4;}}.mascot .mascot-wave.is-b{opacity:0;}.mascot.is-waving .mascot-wave.is-a{animation:mascot-wave-a 0.9s steps(1,end) infinite;}.mascot.is-waving .mascot-wave.is-b{animation:mascot-wave-b 0.9s steps(1,end) infinite;}@keyframes mascot-wave-a{50%{opacity:0;}}@keyframes mascot-wave-b{0%{opacity:0;}50%{opacity:1;}100%{opacity:0;}}.mascot.is-still,.mascot.is-still *{animation:none;}@media (prefers-reduced-motion:reduce){.mascot,.mascot *{animation:none !important;}}</style><g class="mascot-art"><g class="mascot-shadow"><rect x="4" y="14" width="8" height="1" fill="#171917" fill-opacity="0.12"/></g><g class="mascot-body"><rect x="3" y="2" width="7" height="1" fill="#171917"/><rect x="3" y="3" width="1" height="1" fill="#171917"/><rect x="4" y="3" width="1" height="1" fill="#D5F55E"/><rect x="5" y="3" width="4" height="1" fill="#B5EA0B"/><rect x="9" y="3" width="2" height="1" fill="#171917"/><rect x="3" y="4" width="1" height="1" fill="#171917"/><rect x="4" y="4" width="1" height="1" fill="#D5F55E"/><rect x="5" y="4" width="4" height="1" fill="#B5EA0B"/><rect x="9" y="4" width="1" height="1" fill="#171917"/><rect x="10" y="4" width="1" height="1" fill="#D5F55E"/><rect x="11" y="4" width="1" height="1" fill="#171917"/><rect x="3" y="5" width="1" height="1" fill="#171917"/><rect x="4" y="5" width="1" height="1" fill="#D5F55E"/><rect x="5" y="5" width="4" height="1" fill="#B5EA0B"/><rect x="9" y="5" width="4" height="1" fill="#171917"/><rect x="3" y="6" width="1" height="1" fill="#171917"/><rect x="4" y="6" width="1" height="1" fill="#D5F55E"/><rect x="5" y="6" width="6" height="1" fill="#B5EA0B"/><rect x="11" y="6" width="1" height="1" fill="#8DB605"/><rect x="12" y="6" width="1" height="1" fill="#171917"/><rect x="3" y="7" width="1" height="1" fill="#171917"/><rect x="4" y="7" width="7" height="1" fill="#B5EA0B"/><rect x="11" y="7" width="1" height="1" fill="#8DB605"/><rect x="12" y="7" width="1" height="1" fill="#171917"/><rect x="3" y="8" width="1" height="1" fill="#171917"/><rect x="4" y="8" width="7" height="1" fill="#B5EA0B"/><rect x="11" y="8" width="1" height="1" fill="#8DB605"/><rect x="12" y="8" width="1" height="1" fill="#171917"/><rect x="3" y="9" width="1" height="1" fill="#171917"/><rect x="4" y="9" width="7" height="1" fill="#B5EA0B"/><rect x="11" y="9" width="1" height="1" fill="#8DB605"/><rect x="12" y="9" width="1" height="1" fill="#171917"/><rect x="3" y="10" width="1" height="1" fill="#171917"/><rect x="4" y="10" width="7" height="1" fill="#B5EA0B"/><rect x="11" y="10" width="1" height="1" fill="#8DB605"/><rect x="12" y="10" width="1" height="1" fill="#171917"/><rect x="3" y="11" width="1" height="1" fill="#171917"/><rect x="4" y="11" width="8" height="1" fill="#8DB605"/><rect x="12" y="11" width="1" height="1" fill="#171917"/><rect x="4" y="12" width="8" height="1" fill="#171917"/><rect x="5" y="13" width="2" height="1" fill="#171917"/><rect x="9" y="13" width="2" height="1" fill="#171917"/><g class="mascot-arms"><rect x="2" y="9" width="1" height="1" fill="#171917"/><rect x="13" y="9" width="1" height="1" fill="#171917"/><rect x="2" y="10" width="1" height="1" fill="#171917"/><rect x="13" y="10" width="1" height="1" fill="#171917"/></g><g class="mascot-face"><g class="mascot-eyes"><rect x="5" y="7" width="1" height="1" fill="#171917"/><rect x="10" y="7" width="1" height="1" fill="#171917"/><rect x="5" y="8" width="1" height="1" fill="#171917"/><rect x="10" y="8" width="1" height="1" fill="#171917"/></g></g></g></g></svg>
